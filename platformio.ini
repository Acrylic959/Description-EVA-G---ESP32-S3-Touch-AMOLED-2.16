; ============================================================
; EVA 车载 G 值表固件 - PlatformIO 配置
; 硬件: 微雪 ESP32-S3-Touch-AMOLED-2.16
;       ESP32-S3R8 (8MB OPI PSRAM + 16MB Flash, 240MHz)
; ============================================================

[env:waveshare-esp32s3-amoled-216]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ---- MCU ----
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ---- PSRAM: ESP32-S3R8 为 8MB OPI(八线) PSRAM ----
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -O2

; ---- 依赖库 (微雪官方推荐版本) ----
lib_deps =
    moononournation/GFX Library for Arduino @ 1.5.0
    lewisxhe/SensorLib @ 0.3.3
